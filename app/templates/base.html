<!DOCTYPE html>
<html lang="en">
<head>

  <title>{% block title %}Rossmann Sales Forecast{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

      <span class="brand">Rossmann Sales Forecast</span>

  </footer>
</body>
</html>
